<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FitBuddy AI personalized fitness planner">
<title>{% block title %}FitBuddy{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark">F</span><span>FitBuddy<span class="brand-dot">.</span></span></a>
<nav><a href="/">Create plan</a><a href="/docs" target="_blank">API</a><a href="/admin">Admin</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer"><p>FitBuddy · AI-assisted wellness planning</p><p>General fitness information only — not medical advice.</p></footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body></html>
